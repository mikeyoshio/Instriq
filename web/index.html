<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Instriq: aprende instrumental quirúrgico y comparte tarjetas de preferencia con tu hospital.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Instriq">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Instriq</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Splash mientras se descarga y arranca el motor (CanvasKit + main.dart.js,
    varios MB): sin esto la pestaña quedaba en blanco todo ese tiempo
    (hallazgo de auditoría de rendimiento, 2026-09). Es un simple hermano en
    el DOM anterior al punto de montaje de Flutter -- en cuanto el motor
    inserta su propio elemento raíz (opaco) lo tapa por completo, sin
    necesitar JS para retirarlo.
  -->
  <style>
    #instriq-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #162B56;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #instriq-splash span {
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #instriq-splash .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      animation: instriq-spin 0.8s linear infinite;
    }
    @keyframes instriq-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="instriq-splash">
    <div class="spinner"></div>
    <span>Instriq</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
